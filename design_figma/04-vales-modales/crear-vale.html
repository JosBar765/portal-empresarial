<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal — Crear Vale de Arte | Portal Empresarial</title>
  <link rel="stylesheet" href="../assets/css/vales.css">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="header-brand">
      <a href="#" class="header-back" title="Volver al dashboard"><ion-icon name="arrow-back-outline"></ion-icon></a>
      <div class="header-logo-container"><img src="../assets/logos/LOGO_GP_isotipo.png" alt="MundiTrofeos Isotipo" class="header-logo"></div>
      <div class="header-title-wrapper">
        <span class="header-title">Vales de Arte</span>
        <span class="header-company">MundiTrofeos S.A.</span>
      </div>
    </div>
    <div class="header-user-menu">
      <div class="user-profile">
        <span class="user-name">Asesor Comercial</span>
        <span class="user-role">Asesor de Ventas</span>
      </div>
      <button class="btn-logout" title="Cerrar sesión"><ion-icon name="log-out-outline"></ion-icon><span>Salir</span></button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar-vales">
      <button class="sidebar-item sidebar-item-active"><ion-icon name="file-tray-full-outline"></ion-icon><span>Buzón</span></button>
      <button class="sidebar-item"><ion-icon name="checkmark-done-circle-outline"></ion-icon><span>Trabajo realizado</span></button>
    </aside>
    <main class="main-container">
      <section class="dashboard-toolbar">
        <div class="ventana-selector">
          <button class="chip">Día</button><button class="chip">Semana</button><button class="chip">Mes</button><button class="chip chip-active">Todo</button>
        </div>
        <button class="btn-primary"><ion-icon name="add-outline"></ion-icon>Crear Vale de Arte</button>
      </section>
      <section class="contadores-grid">
        <div class="contador-card"><div class="valor">6</div><div class="etiqueta">Vales restantes hoy</div></div>
        <div class="contador-card"><div class="valor">1</div><div class="etiqueta">Vales por revisar</div></div>
        <div class="contador-card"><div class="valor">0</div><div class="etiqueta">Pend. modificación</div></div>
        <div class="contador-card contador-alerta"><div class="valor">3</div><div class="etiqueta">Atrasados</div></div>
      </section>
    </main>
  </div>

  <!-- Modal: Crear Vale de Arte (#modals-root) -->
  <div id="modals-root">
    <div class="modal-overlay">
      <div class="modal-box modal-lg">
        <div class="modal-header">
          <h3>Crear Vale de Arte</h3>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <form>
            <div class="section-title">Información de Cliente</div>
            <div class="form-grid">
              <div class="form-field"><label>Empresa</label><input type="text" /></div>
              <div class="form-field"><label>Cliente *</label><input type="text" required /></div>
              <div class="form-field">
                <label>Teléfono *</label>
                <div class="form-field-phone">
                  <select><option>+502 GT</option></select>
                  <input type="text" required placeholder="0000-0000" />
                </div>
              </div>
              <div class="form-field"><label>Correo *</label><input type="email" required /></div>
            </div>

            <div class="section-title">Información de Venta</div>
            <div class="form-grid">
              <div class="form-field"><label>Fecha de entrega *</label><input type="datetime-local" required /></div>
              <div class="form-field"><label>Fecha del evento *</label><input type="datetime-local" required /></div>
              <div class="form-field"><label>Código de producto *</label><select required><option>Trofeo Copa Grande</option></select></div>
              <div class="form-field"><label>Material *</label><select required><option>Resina</option></select></div>
              <div class="form-field"><label>Técnica *</label><select required><option>Grabado láser</option></select></div>
              <div class="form-field"><label>Acabado *</label><select required><option>Dorado brillante</option></select></div>
              <div class="form-field"><label>Cantidad * (mayor a 1)</label><input type="number" min="2" required /></div>
              <div class="form-field"><label>No. Cotización *</label><input type="number" min="0.01" step="0.01" required /></div>
              <div class="form-field form-checkbox full"><input type="checkbox" id="chk-urgente" /><label for="chk-urgente">Urgente</label></div>
            </div>

            <div class="section-title">Boceto y Descripción</div>
            <div class="form-grid">
              <div class="form-field full"><label>Descripción (máx. 600 caracteres)</label><textarea></textarea></div>
              <div class="form-field"><label>Imágenes (jpg, jpeg, png, webp — máx. 2MB c/u)</label><input type="file" multiple /></div>
              <div class="form-field"><label>Documentos adjuntos (PDF — máx. 3MB c/u)</label><input type="file" multiple /></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary">Cancelar</button>
          <button class="btn-primary">Crear Vale de Arte</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <span class="footer-text">© 2026 MundiTrofeos S.A. | Portal de Herramientas Corporativo Interno</span>
  </footer>

</body>
</html>
