<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal — Carga de Trabajo | Portal Empresarial</title>
  <link rel="stylesheet" href="../assets/css/vales.css">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="header-brand">
      <a href="#" class="header-back" title="Volver al dashboard"><ion-icon name="arrow-back-outline"></ion-icon></a>
      <div class="header-logo-container"><img src="../assets/logos/LOGO_GP_isotipo.png" alt="MundiTrofeos Isotipo" class="header-logo"></div>
      <div class="header-title-wrapper">
        <span class="header-title">Vales de Arte</span>
        <span class="header-company">MundiTrofeos S.A.</span>
      </div>
    </div>
    <div class="header-user-menu">
      <div class="user-profile">
        <span class="user-name">Encargado de Diseño</span>
        <span class="user-role">Encargado de Diseño</span>
      </div>
      <button class="btn-logout" title="Cerrar sesión"><ion-icon name="log-out-outline"></ion-icon><span>Salir</span></button>
    </div>
  </header>

  <div class="app-layout">
    <main class="main-container">
      <section class="contadores-grid">
        <div class="contador-card"><div class="valor">5</div><div class="etiqueta">Asignados</div></div>
      </section>
    </main>
  </div>

  <div id="modals-root">
    <div class="modal-overlay">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Carga de trabajo</h3>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="carga-tecnico">
            <div class="nombre">Técnico Diseño A</div>
            <div class="carga-barra"><div class="carga-barra-fill" style="width:80%"></div></div>
            <div style="font-size:12px;color:var(--color-on-surface-variant);">Asignaciones: 4 · En proceso: GUA-3-0010</div>
          </div>
          <div class="carga-tecnico">
            <div class="nombre">Técnico Diseño B</div>
            <div class="carga-barra"><div class="carga-barra-fill" style="width:20%"></div></div>
            <div style="font-size:12px;color:var(--color-on-surface-variant);">Asignaciones: 1 · En proceso: Ninguno</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Widget flotante que abre este modal -->
  <button class="btn-carga-trabajo" title="Carga de trabajo"><ion-icon name="people-outline"></ion-icon></button>

  <footer class="app-footer">
    <span class="footer-text">© 2026 MundiTrofeos S.A. | Portal de Herramientas Corporativo Interno</span>
  </footer>

</body>
</html>
