<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vales de Arte | Portal Empresarial</title>
  <link rel="icon" type="image/png" href="/assets/logos/LOGO_GP_isotipo.png">
  <link rel="stylesheet" href="/modules/vales/css/styles.css">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="header-brand">
      <a href="/dashboard/" class="header-back" title="Volver al dashboard">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </a>
      <div class="header-logo-container">
        <img src="/assets/logos/LOGO_GP_isotipo.png" alt="MundiTrofeos Isotipo" class="header-logo">
      </div>
      <div class="header-title-wrapper">
        <span class="header-title">Vales de Arte</span>
        <span class="header-company">MundiTrofeos S.A.</span>
      </div>
    </div>

    <div class="header-user-menu">
      <div class="user-profile">
        <span class="user-name" id="user-display-name">Cargando usuario...</span>
        <span class="user-role" id="user-display-role">Cargando rol...</span>
      </div>
      <button class="btn-logout" id="logout-btn" title="Cerrar sesión">
        <ion-icon name="log-out-outline"></ion-icon>
        <span>Salir</span>
      </button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar-vales" id="sidebar-vales" style="display:none;">
      <button class="sidebar-item sidebar-item-active" data-vista="buzon">
        <ion-icon name="file-tray-full-outline"></ion-icon>
        <span>Buzón</span>
      </button>
      <button class="sidebar-item" data-vista="trabajo">
        <ion-icon name="checkmark-done-circle-outline"></ion-icon>
        <span>Trabajo realizado</span>
      </button>
    </aside>

    <main class="main-container">

      <section class="dashboard-toolbar">
        <div class="ventana-selector" id="ventana-selector">
          <button data-ventana="dia" class="chip">Día</button>
          <button data-ventana="semana" class="chip">Semana</button>
          <button data-ventana="mes" class="chip">Mes</button>
          <button data-ventana="todo" class="chip chip-active">Todo</button>
          <div class="ventana-rango">
            <input type="date" id="ventana-desde" class="ventana-fecha" title="Desde" />
            <span class="ventana-rango-sep">—</span>
            <input type="date" id="ventana-hasta" class="ventana-fecha" title="Hasta" />
          </div>
        </div>
        <button class="btn-primary" id="btn-nuevo-vale" style="display:none;">
          <ion-icon name="add-outline"></ion-icon>
          Crear Vale de Arte
        </button>
      </section>

      <section class="contadores-grid" id="contadores-grid"></section>

      <section class="buzon-section">
        <div class="buzon-toolbar">
          <h2 id="buzon-titulo">Buzón de Vales de Arte</h2>
          <div class="buzon-filtros">
            <input type="text" id="filtro-texto" placeholder="Buscar por correlativo o cliente..." />
            <select id="filtro-estado">
              <option value="">Todos los estados</option>
            </select>
          </div>
        </div>

        <div class="tabla-wrapper">
          <table class="buzon-table">
            <thead>
              <tr>
                <th data-sort-key="correlativo">Correlativo</th>
                <th data-sort-key="fecha_ingreso">Fecha Ingreso</th>
                <th data-sort-key="fecha_entrega">Fecha Entrega</th>
                <th>Atraso</th>
                <th data-sort-key="fecha_evento">Fecha Evento</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="buzon-tbody">
              <tr><td colspan="7" class="tabla-vacia">Cargando vales de arte...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Widget flotante de carga de trabajo (solo encargados) -->
  <button class="btn-carga-trabajo" id="btn-carga-trabajo" style="display:none;" title="Carga de trabajo">
    <ion-icon name="people-outline"></ion-icon>
  </button>

  <div id="modals-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <footer class="app-footer">
    <span class="footer-text">© 2026 MundiTrofeos S.A. | Portal de Herramientas Corporativo Interno</span>
  </footer>

  <script src="/modules/vales/js/app.js"></script>
</body>
</html>
