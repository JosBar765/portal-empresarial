<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vales de Arte | Portal Empresarial</title>
  <link rel="icon" type="image/png" href="/assets/logos/LOGO_GP_isotipo.png">
  <link rel="stylesheet" href="/modules/vales/css/styles.css">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <!-- Solo usado por el Dashboard de Gerencia (analisis_correcciones_7.md) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- El navbar siempre conserva su ancho completo arriba de todo — el
       sidebar arranca justo debajo (top: var(--header-height) en CSS), nunca
       detrás de él. -->
  <header class="app-header">
    <div class="header-brand">
      <button class="sidebar-toggle-mobile" id="sidebar-toggle-mobile" type="button" style="display:none;" title="Menú">
        <ion-icon name="menu-outline"></ion-icon>
      </button>
      <a href="/dashboard/" class="header-back" title="Volver al dashboard">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </a>
      <div class="header-logo-container">
        <img src="/assets/logos/LOGO_GP_isotipo.png" alt="MundiTrofeos Isotipo" class="header-logo">
      </div>
      <div class="header-title-wrapper">
        <span class="header-title">Vales de Arte</span>
        <span class="header-company">MundiTrofeos S.A.</span>
      </div>
    </div>

    <div class="header-user-menu">
      <button class="account-widget" id="account-widget" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="account-avatar" id="account-avatar">--</span>
        <div class="user-profile">
          <span class="user-name" id="user-display-name">Cargando usuario...</span>
          <span class="user-role" id="user-display-role">Cargando rol...</span>
        </div>
        <ion-icon name="chevron-down-outline" class="account-chevron"></ion-icon>
      </button>
      <div class="account-dropdown" id="account-dropdown">
        <div class="account-dropdown-header">
          <span class="account-dropdown-name" id="account-dropdown-name">Cargando usuario...</span>
          <span class="account-dropdown-role" id="account-dropdown-role">Cargando rol...</span>
        </div>
        <button class="account-dropdown-item" id="logout-btn" type="button">
          <ion-icon name="log-out-outline"></ion-icon>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Sidebar anclado al borde izquierdo, debajo del navbar — fuera de
       .app-shell a propósito (position:fixed no depende del padre, y así el
       resto del layout solo necesita compensarlo con --sidebar-offset). -->
  <aside class="sidebar-vales" id="sidebar-vales" style="display:none;">
    <!-- Para el Gerente estos dos botones se reescriben en JS como
         Dashboard/Vales de Arte (analisis_correcciones_7.md, Vista Gerencia)
         — ver wireSidebar() en app.js. -->
    <button class="sidebar-item sidebar-item-active" id="sidebar-item-primario" data-vista="buzon">
      <ion-icon name="file-tray-full-outline"></ion-icon>
      <span>Buzón</span>
    </button>
    <button class="sidebar-item" id="sidebar-item-secundario" data-vista="trabajo">
      <ion-icon name="checkmark-done-circle-outline"></ion-icon>
      <span>Trabajo realizado</span>
    </button>
    <button class="sidebar-collapse-toggle" id="sidebar-collapse-toggle" type="button" title="Colapsar menú">
      <ion-icon name="chevron-back-outline"></ion-icon>
      <span>Colapsar</span>
    </button>
  </aside>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="app-shell">
    <div class="app-layout">
      <main class="main-container">

        <section class="dashboard-toolbar">
          <div class="ventana-selector" id="ventana-selector">
            <button data-ventana="dia" class="chip">Día</button>
            <button data-ventana="semana" class="chip">Semana</button>
            <button data-ventana="mes" class="chip">Mes</button>
            <button data-ventana="todo" class="chip chip-active">Todo</button>
            <div class="ventana-rango" id="ventana-rango"></div>
          </div>
          <!-- Solo Gerencia: filtra por tienda tanto el Dashboard como la lista de
               Vales de Arte (analisis_correcciones_7.md, Vista Gerencia). -->
          <select id="filtro-tienda" class="filtro-tienda" style="display:none;">
            <option value="">Todas las tiendas</option>
          </select>
          <button class="btn btn--primary" id="btn-nuevo-vale" style="display:none;">
            <ion-icon name="add-outline"></ion-icon>
            Crear Vale de Arte
          </button>
        </section>

        <section class="contadores-grid" id="contadores-grid"></section>

        <!-- Dashboard de Gerencia (analisis_correcciones_7.md) — reemplaza a
             contadores-grid + buzon-section mientras state.vista === 'dashboard'. -->
        <section class="dashboard-gerencia" id="dashboard-gerencia" style="display:none;"></section>

        <section class="buzon-section">
          <div class="buzon-toolbar">
            <h2 id="buzon-titulo">Buzón de Vales de Arte</h2>
            <div class="buzon-filtros">
              <input type="text" id="filtro-texto" placeholder="Buscar por correlativo o cliente..." />
              <select id="filtro-estado">
                <option value="">Todos los estados</option>
              </select>
            </div>
          </div>

          <div class="tabla-wrapper">
            <table class="buzon-table data-table sticky-header">
              <thead>
                <tr>
                  <th data-sort-key="correlativo">Correlativo</th>
                  <th data-sort-key="fecha_ingreso">Fecha Ingreso</th>
                  <th data-sort-key="fecha_entrega">Fecha Entrega</th>
                  <th>Atraso</th>
                  <th data-sort-key="fecha_evento">Fecha Evento</th>
                  <th class="col-taller">Taller</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="buzon-tbody">
                <tr><td colspan="8" class="tabla-vacia">
                  <div class="buzon-vacio">
                    <ion-icon name="sync-outline" class="spin-animation"></ion-icon>
                    <p>Cargando vales de arte...</p>
                  </div>
                </td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <footer class="app-footer">
      <span class="footer-text">© 2026 MundiTrofeos S.A. | Portal de Herramientas Corporativo Interno</span>
    </footer>
  </div>

  <!-- Widget flotante de carga de trabajo (solo encargados) -->
  <button class="btn-carga-trabajo" id="btn-carga-trabajo" style="display:none;" title="Carga de trabajo">
    <ion-icon name="people-outline"></ion-icon>
  </button>

  <div id="modals-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="/js/toast.js"></script>
  <script src="/modules/vales/js/app.js"></script>
</body>
</html>
