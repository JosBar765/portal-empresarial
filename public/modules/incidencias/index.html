<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- importmap:inicio -->
  <!-- importmap:fin -->
  <title>Incidencias | Portal Empresarial</title>
  <link rel="icon" type="image/png" href="/assets/logos/LOGO_GP_isotipo.png">
  <link rel="stylesheet" href="/modules/incidencias/css/styles.css">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="header-brand">
      <button class="sidebar-toggle-mobile" id="sidebar-toggle-mobile" type="button" title="Menú" aria-label="Abrir el menú" aria-controls="sidebar-incidencias">
        <ion-icon name="menu-outline"></ion-icon>
      </button>
      <a href="/dashboard/" class="header-back" title="Volver al portal" aria-label="Volver al portal">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </a>
      <div class="header-logo-container">
        <img src="/assets/logos/LOGO_GP_isotipo.png" alt="MundiTrofeos Isotipo" class="header-logo">
      </div>
      <div class="header-title-wrapper">
        <span class="header-title">Incidencias</span>
        <span class="header-company">MundiTrofeos S.A.</span>
      </div>
    </div>

    <div class="notif-root" id="notificaciones-root"></div>

    <div class="header-user-menu">
      <button class="account-widget" id="account-widget" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="account-avatar" id="account-avatar">--</span>
        <div class="user-profile">
          <span class="user-name" id="user-display-name">Cargando usuario...</span>
          <span class="user-role" id="user-display-role">Cargando rol...</span>
        </div>
        <ion-icon name="chevron-down-outline" class="account-chevron"></ion-icon>
      </button>
      <div class="account-dropdown" id="account-dropdown">
        <div class="account-dropdown-header">
          <span class="account-dropdown-name" id="account-dropdown-name">Cargando usuario...</span>
          <span class="account-dropdown-role" id="account-dropdown-role">Cargando rol...</span>
        </div>
        <button class="account-dropdown-item" id="logout-btn" type="button">
          <ion-icon name="log-out-outline"></ion-icon>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </div>
  </header>

  <aside class="sidebar-vales" id="sidebar-incidencias" aria-label="Menú de Incidencias">
    <a class="sidebar-item" href="#/mis" data-ruta="mis">
      <ion-icon name="list-outline"></ion-icon>
      <span>Mis incidencias</span>
    </a>
    <a class="sidebar-item" href="#/verificar" data-ruta="verificar" hidden>
      <ion-icon name="shield-checkmark-outline"></ion-icon>
      <span>Por verificar</span>
      <span class="sidebar-contador" id="contador-verificar" hidden></span>
    </a>
    <a class="sidebar-item" href="#/reportar" data-ruta="reportar">
      <ion-icon name="add-outline"></ion-icon>
      <span>Reportar incidencia</span>
    </a>
    <a class="sidebar-item" href="#/configuracion" data-ruta="configuracion" hidden>
      <ion-icon name="settings-outline"></ion-icon>
      <span>Configuración</span>
    </a>
    <button class="sidebar-collapse-toggle" id="sidebar-collapse-toggle" type="button" title="Colapsar menú">
      <ion-icon name="chevron-back-outline"></ion-icon>
      <span>Colapsar</span>
    </button>
  </aside>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="app-shell">
    <div class="app-layout">
      <main class="main-container">
        <section id="panel-content" class="panel-content" aria-live="polite">
          <div class="inc-cargando" role="status">
            <ion-icon name="sync-outline" class="spin-animation"></ion-icon>
            <p>Cargando incidencias...</p>
          </div>
        </section>
      </main>
    </div>

    <footer class="app-footer">
      <span class="footer-text">© 2026 MundiTrofeos S.A. | Portal de Herramientas Corporativo Interno</span>
    </footer>
  </div>

  <div id="modals-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="/js/sessionGuard.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/notificaciones.js"></script>
  <script type="module" src="/modules/incidencias/js/app.js"></script>
</body>
</html>
